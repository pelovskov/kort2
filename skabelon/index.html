<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kort</title>
<!--
  Generisk kort-skabelon. Titel, tekster og alle steder ligger i data.json
  og redigeres med admin/index.html på din egen computer. Se LÆSMIG.md.
-->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" integrity="sha256-YU3qCpj/P06tdPBJGPax0bm6Q1wltfwjsho5TR4+TYc=" crossorigin="">
<link rel="stylesheet" href="style.css?v=1">
</head>
<body>
<header class="hoved">
  <div class="hoved-indre">
    <div>
      <h1 id="titel">Kort</h1>
      <p id="undertitel" hidden></p>
    </div>
    <button type="button" class="knap lys" id="omKnap" hidden>Om</button>
  </div>
</header>

<main class="side">
  <div class="vaerktoej">
    <div class="soeg">
      <label for="q" class="sr">Søg</label>
      <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="q" type="search" placeholder="Søg" autocomplete="off">
    </div>
    <div class="chips" id="chips" role="group" aria-label="Kategorier"></div>
  </div>

  <div class="visning" role="group" aria-label="Visning">
    <button type="button" id="visListe" aria-pressed="true">Liste</button>
    <button type="button" id="visKort" aria-pressed="false">Kort</button>
  </div>

  <div class="layout" id="layout" data-view="list">
    <section class="listewrap" aria-label="Steder">
      <p class="antal" id="antal" aria-live="polite"></p>
      <ol class="liste" id="liste"></ol>
    </section>
    <div class="kortwrap"><div id="map"></div></div>
  </div>
</main>

<dialog id="dlg" aria-labelledby="dTitel">
  <button class="luk" id="dLuk" type="button" aria-label="Luk">×</button>
  <div id="dIndhold"></div>
</dialog>

<dialog id="omDlg" aria-labelledby="omTitel">
  <button class="luk" id="omLuk" type="button" aria-label="Luk">×</button>
  <div class="d-tekst-wrap">
    <h2 id="omTitel"></h2>
    <div class="d-tekst" id="omTekst"></div>
  </div>
</dialog>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js" integrity="sha256-Hk4dIpcqOSb0hZjgyvFOP+cEmDXUKKNE/tT542ZbNQg=" crossorigin=""></script>
<script src="app.js?v=1"></script>
</body>
</html>
